<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    padding:40px;
    background:
        radial-gradient(circle at top left,#4f46e5 0%,transparent 40%),
        radial-gradient(circle at bottom right,#06b6d4 0%,transparent 40%),
        linear-gradient(135deg,#0f172a,#312e81);
    color:white;
}

.title-card{
    max-width:500px;
    margin:0 auto 30px;
    text-align:center;
    padding:25px;

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(18px);

    border-radius:24px;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.sound-grid{
    max-width:1200px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.sound-btn{
    padding:30px;
    border:none;
    cursor:pointer;

    border-radius:22px;

    color:white;
    font-size:20px;
    font-weight:bold;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(18px);

    box-shadow:0 8px 24px rgba(0,0,0,.25);
    transition:.25s;
}

.sound-btn:hover{
    transform:translateY(-8px);
    background:rgba(255,255,255,.16);
    border-color:#60a5fa;
    box-shadow:0 15px 30px rgba(37,99,235,.25);
}

.sound-btn:active{
    transform:scale(.95);
}

.sound-card{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.pause-btn{
    padding:12px;
    border:none;
    cursor:pointer;

    border-radius:14px;

    color:white;
    font-size:16px;
    font-weight:bold;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);

    transition:.25s;
}

.pause-btn:hover{
    background:rgba(255,255,255,.16);
}

.menu-btn{
    position:fixed;
    top:20px;
    left:20px;
    z-index:1001;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    color:white;
    font-size:24px;
    padding:10px 15px;
    border-radius:12px;
    cursor:pointer;
    backdrop-filter:blur(18px);
}

.sidebar{
    position:fixed;
    left:-280px;
    top:0;
    width:250px;
    height:100%;
    background:rgba(15,23,42,.95);
    border-right:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(18px);
    transition:.3s;
    z-index:1000;
    padding:20px;
}

.sidebar.open{
    left:0;
}

.sidebar h2{
    margin:60px 0 20px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
    margin:5px 0;
}

.sidebar a:hover{
    background:rgba(255,255,255,.1);
}

.search-container{
    max-width:500px;
    margin:0 auto 25px;
}

#soundSearch{
    width:100%;
    padding:15px 20px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.08);
    color:white;
    font-size:18px;
    backdrop-filter:blur(18px);
}

#soundSearch::placeholder{
    color:rgba(255,255,255,.7);
}

.copyright {
  text-align: center;
  color: rgba(255,255,255,0.8);
  font-size: 14px;
  padding: 20px;
  margin-top: 40px;
}

.download-btn{
    padding:12px;
    border:none;
    cursor:pointer;
    border-radius:14px;
    color:white;
    font-size:16px;
    font-weight:bold;
    background:#22c55e;
    transition:.25s;
    width:100%;
}

.download-btn:hover{
    background:#16a34a;
}
</style>

<script>
function playSound(id){
    const sound = document.getElementById(id);

    if(sound.paused){
        sound.play();
    }else{
        sound.pause();
    }
}

function toggleMenu(){
    document.getElementById("sidebar").classList.toggle("open");
}

document.addEventListener("click", function(event){
    const sidebar = document.getElementById("sidebar");
    const button = document.querySelector(".menu-btn");

    if (
        sidebar.classList.contains("open") &&
        !sidebar.contains(event.target) &&
        !button.contains(event.target)
    ){
        sidebar.classList.remove("open");
    }
});

function filterSounds() {
    const input = document.getElementById("soundSearch");
    const filter = input.value.toLowerCase();
    const buttons = document.querySelectorAll(".sound-btn");

    buttons.forEach(button => {
        const text = button.textContent.toLowerCase();

        if (text.includes(filter)) {
            button.style.display = "";
        } else {
            button.style.display = "none";
        }
    });
}
</script>
