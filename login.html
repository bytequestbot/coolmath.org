<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Perfect</title>
    <link rel="icon" href="img/ep.png" type="image/png">

    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:
            radial-gradient(circle at top left,#4f46e5 0%,transparent 40%),
            radial-gradient(circle at bottom right,#06b6d4 0%,transparent 40%),
            linear-gradient(135deg,#0f172a,#312e81);
        color:white;
    }

    .login-box{
        width:450px;
        padding:45px;
        border-radius:28px;
        backdrop-filter:blur(20px);
        background:rgba(255,255,255,0.08);
        border:1px solid rgba(255,255,255,0.15);
        box-shadow:0 10px 40px rgba(0,0,0,.35);
    }

    h1{
        text-align:center;
        margin-bottom:30px;
        font-size:2rem;
    }

    .input-group{
        margin-bottom:18px;
    }

    .input-group input{
        width:100%;
        padding:16px;
        border:none;
        outline:none;
        border-radius:16px;
        background:rgba(255,255,255,0.08);
        border:1px solid rgba(255,255,255,0.15);
        color:white;
        font-size:16px;
    }

    .input-group input::placeholder{
        color:#cbd5e1;
    }

    .input-group input:focus{
        border-color:#60a5fa;
        box-shadow:0 0 20px rgba(96,165,250,.25);
    }

    button{
        width:100%;
        padding:16px;
        margin-top:10px;
        border:none;
        border-radius:16px;
        cursor:pointer;
        font-size:18px;
        font-weight:700;
        color:white;

        background:linear-gradient(135deg,#2563eb,#06b6d4);

        transition:all .25s ease;
    }

    button:hover{
        transform:translateY(-3px);
        box-shadow:0 10px 25px rgba(37,99,235,.35);
    }

    #message{
        text-align:center;
        margin-top:15px;
        color:#fca5a5;
        min-height:20px;
    }
    </style>
</head>

<body>

    <div class="login-box">
        <h1>Password Required</h1>

        <div class="input-group">
            <input type="password" id="password" placeholder="Password">
        </div>

        <button onclick="login()">Login</button>
        <p id="message"></p>
    </div>

    <script>
        function login() {
            const password = document.getElementById("password").value;

            const correctPassword = "admin";

            if (
                password === correctPassword
            ) {
                window.location.href = "sites.html";
            } else {
                document.getElementById("message").textContent =
                    "Invalid username or password.";
            }
        }
    </script>
    

</body>
</html>
